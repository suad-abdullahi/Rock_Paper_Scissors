<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">
        <h1>🪨 Rock Paper Scissors ✂️</h1>
        <p class="subtitle">Play against the Computer!</p>

        <div class="score-board">
            <div>
                <h3>You</h3>
                <p id="playerScore">0</p>
            </div>

            <div>
                <h3>Computer</h3>
                <p id="computerScore">0</p>
            </div>
        </div>

        <h2>Choose Your Move</h2>

        <div class="choices">
            <button onclick="playGame('Rock')">🪨 Rock</button>
            <button onclick="playGame('Paper')">📄 Paper</button>
            <button onclick="playGame('Scissors')">✂️ Scissors</button>
        </div>

        <div class="result">
            <p id="playerChoice">Your choice: -</p>
            <p id="computerChoice">Computer choice: -</p>
            <h2 id="result">Let's Play!</h2>
        </div>

        <button class="reset" onclick="resetGame()">
            🔄 Reset Game
        </button>
    </div>

    <script src="script.js"></script>
</body>

</html>
